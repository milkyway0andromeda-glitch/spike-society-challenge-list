<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spike Society Challenge List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">SPIKE SOCIETY CHALLENGE LIST</div>
  <nav class="tabs">
    <button class="nav-button active" data-page="list">LIST</button>
    <button class="nav-button" data-page="leaderboard">LEADERBOARD</button>
    <button class="nav-button" data-page="packs">PACKS</button>
    <span id="auth-nav-slot" class="auth-nav-slot"></span>
  </nav>
</header>
<main>
  <section id="list-page" class="page active-page">
    <div class="page-header">
      <h1>Challenge List</h1>
      <p>The server's ranked challenge list.</p>
    </div>
    <div id="level-list"></div>
  </section>
  <section id="leaderboard-page" class="page">
    <div class="page-header">
      <h1>Leaderboard</h1>
      <p>Points are calculated automatically from completed challenges.</p>
    </div>
    <div id="player-list" class="leaderboard"></div>
  </section>
  <section id="packs-page" class="page">
    <div class="page-header"><h1>Challenge Packs</h1><p>Collections of ranked challenges.</p></div>
    <div id="pack-list" class="pack-list"></div>
  </section>
</main>
<script src="auth.js"></script>
<script src="points.js"></script>
<script src="script.js"></script>
</body>
</html>
